# 一键发布：Actions 页面手动运行，填版本号即可打出正式签名的 release APK，
# 自动创建 v<版本> 标签并直接挂到 GitHub Release（资产是 APK 本体，不产生 zip）。
# 也可以用命令行触发：git tag v1.1.0 && git push（本流程的 push tags 分支也能发布）。
#
# 注意：一键发布用 softprops 创建 v* 标签时会再触发一次本流程（push tags），
# 所以第一步先查「该 tag 是否已有 release」，已存在就直接跳过，避免重复构建/发布。
name: 一键发布

on:
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号（如 1.1.0）。会自动打 v1.1.0 标签并发布带 APK 的 GitHub Release"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析版本号与标签
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "tag=v${v}" >> "$GITHUB_OUTPUT"

      - name: 该标签已有 release 则跳过（一键发布推标签会再次触发本流程）
        id: check
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up JDK 17
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.check.outputs.exists == 'false'
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle（缓存依赖）
        if: steps.check.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK（注入版本号，versionCode 随版本自动递增）
        if: steps.check.outputs.exists == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionName=${{ steps.version.outputs.version }} --no-daemon

      - name: Publish GitHub Release（直接挂 APK）
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true